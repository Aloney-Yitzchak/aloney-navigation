plugins {
    id 'com.android.application'
    // Reads app/google-services.json (Firebase config; not in git, see app/README.md)
    id 'com.google.gms.google-services'
    // Renders layouts on the computer for screenshot tests (T30): ./gradlew recordPaparazziDebug
    id 'app.cash.paparazzi'
}

android {
    namespace 'il.org.ay.navigation'
    compileSdk 35

    defaultConfig {
        applicationId 'il.org.ay.navigation'
        minSdk 26
        targetSdk 35
        // CI sets these from the build number (release.yml); local builds stay 1 / 0.1-dev
        versionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('VERSION_NAME') ?: '0.1-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Room writes the schema of every database version to app/schemas (kept in git)
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
        // every emulator test starts from a fresh install: no data, no permissions
        testInstrumentationRunnerArguments clearPackageData: 'true',
                // a stuck emulator test fails after 2 minutes, with where it was stuck,
                // instead of silently using up the whole CI job
                timeout_msec: '120000'
    }

    // One signing key for every build: Android Studio, CI and the GitHub releases. A phone
    // only installs an update signed with the same key as the app already on it, so with a
    // fresh debug key per machine every release would need an uninstall first.
    // This is a debug key with the standard public password, NOT a secret, and it can not
    // be used for Google Play. A store release would need its own key, kept out of git.
    signingConfigs {
        shared {
            storeFile file('shared-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // runs each emulator test in its own process (needed for clearPackageData)
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Fused Location: GPS + Wi-Fi + cell, battery friendly (T11)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // OpenStreetMap map (T29): free, no API key or billing account (SDD 2.4)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // CameraX: the camera screen and the frames for the building model (T16)
    def camerax_version = '1.4.1'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    // CameraX hands back a Guava ListenableFuture; Firestore already brings Guava at run time
    implementation 'com.google.guava:guava:33.3.1-android'

    // ARCore: the arrow anchored on the ground (T18). Optional: phones without it use the compass arrow
    implementation 'com.google.ar:core:1.52.0'

    // Firebase Firestore: the shared campus data (T08)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    // T24: staff sign-in (email and password); the staff claim is checked by the rules
    implementation 'com.google.firebase:firebase-auth'
    // T24b: "sign in with Google" through Android's Credential Manager
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Room: local database (T04)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation "androidx.room:room-testing:$room_version"
    // Emulator tests (GitHub Actions: .github/workflows/android-emulator.yml)
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}
