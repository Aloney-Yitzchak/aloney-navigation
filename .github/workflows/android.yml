name: Android build

on:
  pull_request:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config (placeholder; the real google-services.json is never in git)
        run: test -f app/google-services.json || cp app/google-services.ci.json app/google-services.json
      # verifyPaparazziDebug runs all the unit tests, and also compares every layout with
      # its snapshot in app/src/test/snapshots (T30). After an intended layout change:
      # ./gradlew recordPaparazziDebug, look at the new images, and commit them.
      - name: Build, unit tests and layout snapshots
        run: ./gradlew assembleDebug verifyPaparazziDebug
      - name: Upload layout differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-differences
          path: app/build/paparazzi/failures
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
