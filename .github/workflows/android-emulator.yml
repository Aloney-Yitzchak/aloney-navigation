name: Android emulator tests

# Installs the app on Android emulators and runs the acceptance tests in
# app/src/androidTest (AT-12 and RTL), through the real permission dialogs.
# Screenshots of every screen are attached to the run (Summary → Artifacts).

on:
  pull_request:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/android-emulator.yml']
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]   # Android 10 and Android 14
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and the tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run the tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest || touch tests-failed
            mkdir -p screenshots/api-${{ matrix.api-level }}
            adb pull /sdcard/Pictures/aloney/. screenshots/api-${{ matrix.api-level }}/ || true
            test ! -f tests-failed

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: screenshots/
          if-no-files-found: warn

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
